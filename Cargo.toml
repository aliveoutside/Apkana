[package]
name = "apkana"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
rfd = "0.15"
resand = { git = "https://codeberg.org/fieryhenry/resand.git", rev = "0f98ab5466fab86a2012411ec438c4d7e8a8f13d" }
zip = "2"
serde_json = "1"
tempfile = "3"
sha1 = "0.10"
adler2 = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
