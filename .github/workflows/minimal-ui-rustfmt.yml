name: Format minimal UI polish
on:
  push:
    branches: [feat/egui-ui-migration]
    paths:
      - .github/workflows/minimal-ui-rustfmt.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/view.rs src/ui/common.rs
          if ! git diff --cached --quiet; then
            git commit -m 'style(ui): format minimal visual refinements'
            git push origin HEAD:feat/egui-ui-migration
          fi
