name: Egui migration checks

on:
  pull_request:
  push:
    branches:
      - feat/egui-ui-migration

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check
      - run: cargo test
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egui-cargo-lock
          path: Cargo.lock
